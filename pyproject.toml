[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "das-schloss"
version = "0.1.0"
description = "Evidence-linked individual academic timelines"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "networkx>=3.2,<4", "scikit-learn>=1.5,<2", "scipy>=1.11,<2"]

[project.scripts]
scholartrace = "scholartrace.__main__:main"

[tool.setuptools.packages.find]
include = ["scholartrace*"]

[tool.setuptools.package-data]
scholartrace = ["static/*", "static/vendor/*", "static/locales/*.js", "validation/*.json"]
